# Netlify build settings. `npm install` runs the postinstall script that copies
# the FFmpeg core into public/ffmpeg/ (it is not stored in Git), then
# `astro build` writes the site to dist/.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # package.json requires Node >= 22.12.0.
  NODE_VERSION = "22"

# Basic security headers for every page. The Content-Security-Policy is not
# here: Astro writes it into a <meta> tag on each page (see `security.csp` in
# astro.config.mjs), because it needs the hashes of the inline scripts.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Files in /_astro/ have a hash in their name, so they can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Languages: Spanish is the root, English lives under /en/.
# /es/ is not a real page: send it to the root so there is a single Spanish URL.
[[redirects]]
  from = "/es"
  to = "/"
  status = 301

[[redirects]]
  from = "/es/*"
  to = "/:splat"
  status = 301

# A missing page under /en/ shows the English 404, which Astro builds as /en/404/index.html (real files win over this).
[[redirects]]
  from = "/en/*"
  to = "/en/404/"
  status = 404
